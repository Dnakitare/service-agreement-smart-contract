[profile.default]
src = "contracts"
out = "out"
libs = ["node_modules", "lib"]
test = "test/foundry"
cache_path = "cache_forge"
solc_version = "0.8.28"
# Foundry will download solc 0.8.28 if needed. To use a system solc, set the
# `FOUNDRY_SOLC` env var or the `solc` key here. We rely on auto-download in CI.
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
]

[invariant]
runs = 256
depth = 32
fail_on_revert = false
call_override = false
shrink_run_limit = 5000
