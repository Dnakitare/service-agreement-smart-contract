name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile
        run: npx hardhat compile

      - name: Run test suite
        run: npm test

      - name: Coverage report
        run: npm run coverage

      - name: Verify generated docs are up to date
        run: |
          npm run docs
          if ! git diff --exit-code -- docs/api; then
            echo "::error::docs/api is out of sync with NatSpec. Run 'npm run docs' and commit the result."
            exit 1
          fi

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage/
            coverage.json
          retention-days: 14

  slither:
    name: Slither static analysis
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Slither
        # crytic-action handles solc selection (matches the pragma) and uses our
        # slither.config.json. Suppressed detectors are documented there.
        uses: crytic/slither-action@v0.4.0
        with:
          node-version: 20
          fail-on: low
          slither-config: slither.config.json
